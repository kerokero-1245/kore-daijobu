# main への push と pull request ごとに依存を入れ直し、TypeScript の型チェックを通す
name: CI（型チェック）

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 型チェック
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: Node のセットアップ（.nvmrc）
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存のインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck
