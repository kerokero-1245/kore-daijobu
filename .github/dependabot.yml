# 依存（npm）と GitHub Actions の更新を週 1 回 PR で受け取る
# npm の minor/patch は 1 本のまとめ PR（group minor-and-patch）にし、CI が通ったら
# dependabot-auto-merge.yml が自動で取り込む。major と GitHub Actions の更新は人が判断する。
# Expo SDK が版を決める依存（node_modules/expo/bundledNativeModules.json に載っていて package.json にあるもの）は
# 全部の更新を受けない。上げるときは SDK の更新と一緒に `npx expo install --fix` で揃える（CI の `npx expo install --check` がずれを落とす）。
# expo 本体は major だけ外す（minor/patch は受ける）。typescript の major も人が判断するので外す。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: expo
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ここから Expo SDK が版を決める依存（17 個）。update-types を書かないので全部の更新を外す
      - dependency-name: "@expo/metro-runtime"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: eslint-config-expo
      - dependency-name: expo-constants
      - dependency-name: expo-crypto
      - dependency-name: expo-device
      - dependency-name: expo-notifications
      - dependency-name: expo-secure-store
      - dependency-name: expo-status-bar
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-get-random-values
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      - dependency-name: react-native-web

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
